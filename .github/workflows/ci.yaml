# test → build (native amd64 + arm64) → Trivy gate → push by digest
#   → multi-arch manifest → SBOM → cosign keyless sign + SBOM attestation
# Images are only pushed from main (and v* tags); PRs build and scan but publish nothing.
# CI never touches the cluster: Argo CD pulls from the gitops repo.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/denny2020/tixlab
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: tixlab
          POSTGRES_PASSWORD: tixlab
          POSTGRES_DB: tixlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tixlab -d tixlab"
          --health-interval 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-retries 20
    env:
      TIXLAB_DATABASE_URL: postgresql+psycopg://tixlab:tixlab@localhost:5432/tixlab
      TIXLAB_TEST_VALKEY_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install --require-hashes -r api/requirements-dev.txt
      - run: pytest -q
        working-directory: api

  build:
    needs: [secret-scan, test]
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/denny2020/tixlab-${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      # Gate: fixable HIGH/CRITICAL vulnerabilities fail the build before anything is pushed.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build (cache hit), pushed untagged by digest; the publish job tags the multi-arch index.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}

      - if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, worker, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for cosign keyless signing
    env:
      IMAGE: ghcr.io/denny2020/tixlab-${{ matrix.component }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.component }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tags only: sha-<short> always, <semver> on v* tags. Never :latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Create multi-arch manifest
        id: manifest
        working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          tag=${tags[0]}
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >>"$GITHUB_OUTPUT"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.manifest.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          artifact-name: sbom-${{ matrix.component }}.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and logged in Rekor.
      - name: Sign and attest
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "$REF"

      - name: Summary
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: |
          {
            echo "### tixlab-${{ matrix.component }}"
            echo '```'
            jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON"
            echo "$REF"
            echo '```'
            echo "Verify:"
            echo '```'
            echo "cosign verify $REF \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
